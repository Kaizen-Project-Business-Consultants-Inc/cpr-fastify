name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - run: npx tsc --noEmit
      - run: npx vitest run

  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - run: npx vitest run

      # Production build
      - run: VITE_API_URL=https://cpr.kpbc.ca/api/v1 npx vite build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

      # Staging build (same code, staging API URL). The staging server cannot
      # build the frontend itself (vite exceeds its memory limit).
      - run: rm -rf dist && VITE_API_URL=https://stagecprapp.kpbc.ca/api/v1 npx vite build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist-staging
          path: frontend/dist
          retention-days: 3

  deploy-staging:
    name: Deploy to staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: cd backend && npx tsc
      - name: Remove sourcemaps from backend build
        run: find backend/dist -name '*.map' -delete

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist-staging
          path: frontend/dist

      - name: Deploy backend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: backend/dist/
          server-dir: stagecprapp.kpbc.ca/backend/dist/
          dangerous-clean-slate: false

      - name: Deploy frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/
          server-dir: stagecprapp.kpbc.ca/public/
          dangerous-clean-slate: false

      # Passenger restarts the app when tmp/restart.txt's mtime changes.
      # Uploading the file over FTPS updates the mtime; this replaces the old
      # cPanel JSON-API call, which the host rejects (returns its login page).
      - name: Restart application (touch tmp/restart.txt)
        run: |
          echo "restart-$(date +%s)" > /tmp/restart.txt
          curl --fail --silent --show-error -T /tmp/restart.txt --ssl-reqd --insecure \
            "ftps://${{ secrets.FTP_SERVER }}/stagecprapp.kpbc.ca/tmp/restart.txt" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --create-dirs
          echo "restart.txt touched"

      - name: Health check
        run: |
          echo "Waiting 30s for Passenger to restart..."
          sleep 30
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" https://stagecprapp.kpbc.ca/api/v1/health) || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check: OK"
              exit 0
            fi
            sleep 20
          done
          echo "Health check FAILED after 8 attempts"
          exit 1

  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Build backend
      - run: npm ci --legacy-peer-deps
      - run: cd backend && npx tsc
      - name: Remove sourcemaps from backend build
        run: find backend/dist -name '*.map' -delete

      # Download frontend build from previous job
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      # Deploy via FTPS
      - name: Deploy backend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: backend/dist/
          server-dir: cpr.kpbc.ca/backend/dist/
          dangerous-clean-slate: false

      - name: Deploy frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/
          server-dir: cpr.kpbc.ca/public/
          dangerous-clean-slate: false

      # Ensure public/.htaccess exists for SPA routing
      - name: Deploy .htaccess via FTPS
        run: |
          cat > /tmp/.htaccess << 'HTEOF'
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]
          HTEOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/.htaccess
          echo "=== .htaccess content ==="
          cat /tmp/.htaccess
          echo "=== Uploading via FTPS ==="
          curl -T /tmp/.htaccess --ssl-reqd --insecure \
            "ftps://${{ secrets.FTP_SERVER }}/cpr.kpbc.ca/public/.htaccess" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -v 2>&1 | grep -E "< |> |Upload|226|550" || true
          echo ".htaccess uploaded"

      # Passenger restarts the app when tmp/restart.txt's mtime changes.
      # Uploading the file over FTPS updates the mtime; this replaces the old
      # cPanel JSON-API call, which the host rejects (returns its login page).
      - name: Restart application (touch tmp/restart.txt)
        run: |
          echo "restart-$(date +%s)" > /tmp/restart.txt
          curl --fail --silent --show-error -T /tmp/restart.txt --ssl-reqd --insecure \
            "ftps://${{ secrets.FTP_SERVER }}/cpr.kpbc.ca/tmp/restart.txt" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --create-dirs
          echo "restart.txt touched"

      # Health check — Passenger can take up to 3 min to restart
      - name: Health check
        run: |
          echo "Waiting 30s for Passenger to restart..."
          sleep 30
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" https://cpr.kpbc.ca/api/v1/health) || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check: OK"
              exit 0
            fi
            sleep 20
          done
          echo "Health check FAILED after 8 attempts"
          exit 1

  notify:
    name: Email notification
    needs: [backend, frontend, deploy, deploy-staging]
    if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        if: needs.deploy.result == 'success' && needs.deploy-staging.result == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CPR Deploy SUCCESS — ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CPR CI/CD <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment to cpr.kpbc.ca and stagecprapp.kpbc.ca completed successfully.

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            By: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: needs.backend.result == 'failure' || needs.frontend.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy-staging.result == 'failure'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CPR Deploy FAILED — ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CPR CI/CD <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment FAILED.

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            By: ${{ github.actor }}

            Backend: ${{ needs.backend.result }}
            Frontend: ${{ needs.frontend.result }}
            Deploy (production): ${{ needs.deploy.result }}
            Deploy (staging): ${{ needs.deploy-staging.result }}

            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
