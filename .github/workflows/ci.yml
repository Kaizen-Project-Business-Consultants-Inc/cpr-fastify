name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: .
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx vitest run
      - name: API reference is up to date (docs/API.md is generated from the route table)
        run: |
          npm run docs:api
          cd .. && git diff --exit-code -- docs/API.md || { echo "docs/API.md is stale — run 'npm run docs:api' in backend/ and commit"; exit 1; }

  frontend:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: .
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run

      # Production build
      - run: VITE_API_URL=https://cpr.kpbc.ca/api/v1 npx vite build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          include-hidden-files: true # .htaccess

      # Staging build (same code, staging API URL). The staging server cannot
      # build the frontend itself (vite exceeds its memory limit).
      - run: rm -rf dist && VITE_API_URL=https://stagecprapp.kpbc.ca/api/v1 npx vite build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist-staging
          path: frontend/dist
          retention-days: 3
          include-hidden-files: true # .htaccess

  deploy-staging:
    name: Deploy to staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps
      - name: Type-check and bundle backend (self-contained dist/index.js)
        run: cd backend && npx tsc --noEmit && node build.mjs
      - name: Smoke-test the bundle (must reach the DB connect step, not a module error)
        run: |
          cd backend
          OUT=$(NODE_ENV=production DB_HOST=127.0.0.1 DB_PORT=1 DB_USER=x DB_PASSWORD=x DB_NAME=x \
            JWT_ACCESS_SECRET=0123456789012345678901234567890123 JWT_REFRESH_SECRET=0123456789012345678901234567890123 \
            FRONTEND_URL=http://localhost timeout 60 node dist/index.js 2>&1 || true)
          echo "$OUT" | tail -3 | cut -c1-300
          echo "$OUT" | grep -q "ECONNREFUSED" || { echo "Bundle did not reach DB connect — module resolution problem?"; exit 1; }

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist-staging
          path: frontend/dist

      - name: Deploy backend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: backend/dist/
          server-dir: stagecprapp.kpbc.ca/backend/dist/
          dangerous-clean-slate: false

      - name: Deploy frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/
          server-dir: stagecprapp.kpbc.ca/public/
          dangerous-clean-slate: false

      # Passenger restarts the app when tmp/restart.txt's mtime changes.
      # Uploading the file over FTPS updates the mtime; this replaces the old
      # cPanel JSON-API call, which the host rejects (returns its login page).
      - name: Restart application (touch tmp/restart.txt)
        run: |
          echo "restart-$(date +%s)" > /tmp/restart.txt
          curl --fail --silent --show-error -T /tmp/restart.txt --ssl-reqd --insecure \
            "ftp://${{ secrets.FTP_SERVER }}/stagecprapp.kpbc.ca/tmp/restart.txt" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --create-dirs
          echo "restart.txt touched"

      - name: Health check
        run: |
          echo "Waiting 30s for Passenger to restart..."
          sleep 30
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" https://stagecprapp.kpbc.ca/api/v1/health) || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check: OK"
              exit 0
            fi
            sleep 20
          done
          echo "Health check FAILED after 8 attempts"
          exit 1

  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Build backend
      - run: npm ci --legacy-peer-deps
      - name: Type-check and bundle backend (self-contained dist/index.js)
        run: cd backend && npx tsc --noEmit && node build.mjs
      - name: Smoke-test the bundle (must reach the DB connect step, not a module error)
        run: |
          cd backend
          OUT=$(NODE_ENV=production DB_HOST=127.0.0.1 DB_PORT=1 DB_USER=x DB_PASSWORD=x DB_NAME=x \
            JWT_ACCESS_SECRET=0123456789012345678901234567890123 JWT_REFRESH_SECRET=0123456789012345678901234567890123 \
            FRONTEND_URL=http://localhost timeout 60 node dist/index.js 2>&1 || true)
          echo "$OUT" | tail -3 | cut -c1-300
          echo "$OUT" | grep -q "ECONNREFUSED" || { echo "Bundle did not reach DB connect — module resolution problem?"; exit 1; }

      # Download frontend build from previous job
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      # Deploy via FTPS
      - name: Deploy backend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: backend/dist/
          server-dir: cpr.kpbc.ca/backend/dist/
          dangerous-clean-slate: false

      - name: Deploy frontend via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: frontend/dist/
          server-dir: cpr.kpbc.ca/public/
          dangerous-clean-slate: false

      # Passenger restarts the app when tmp/restart.txt's mtime changes.
      # Uploading the file over FTPS updates the mtime; this replaces the old
      # cPanel JSON-API call, which the host rejects (returns its login page).
      - name: Restart application (touch tmp/restart.txt)
        run: |
          echo "restart-$(date +%s)" > /tmp/restart.txt
          curl --fail --silent --show-error -T /tmp/restart.txt --ssl-reqd --insecure \
            "ftp://${{ secrets.FTP_SERVER }}/cpr.kpbc.ca/tmp/restart.txt" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --create-dirs
          echo "restart.txt touched"

      # Health check — Passenger can take up to 3 min to restart
      - name: Health check
        run: |
          echo "Waiting 30s for Passenger to restart..."
          sleep 30
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "Accept: application/json" https://cpr.kpbc.ca/api/v1/health) || STATUS="000"
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check: OK"
              exit 0
            fi
            sleep 20
          done
          echo "Health check FAILED after 8 attempts"
          exit 1

  e2e:
    name: E2E (Playwright vs staging)
    timeout-minutes: 30
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite against staging
        env:
          BASE_URL: https://stagecprapp.kpbc.ca
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test --project=chromium --reporter=line
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  notify:
    name: Email notification
    needs: [backend, frontend, deploy, deploy-staging, e2e]
    if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        if: needs.deploy.result == 'success' && needs.deploy-staging.result == 'success'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CPR Deploy SUCCESS — ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CPR CI/CD <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment to cpr.kpbc.ca and stagecprapp.kpbc.ca completed successfully.

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            By: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: needs.backend.result == 'failure' || needs.frontend.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy-staging.result == 'failure'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CPR Deploy FAILED — ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CPR CI/CD <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment FAILED.

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            By: ${{ github.actor }}

            Backend: ${{ needs.backend.result }}
            Frontend: ${{ needs.frontend.result }}
            Deploy (production): ${{ needs.deploy.result }}
            Deploy (staging): ${{ needs.deploy-staging.result }}

            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
